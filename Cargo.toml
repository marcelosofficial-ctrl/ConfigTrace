[package]
name = "configtrace"
version = "1.0.1"
edition = "2024"
description = "Open configuration change tracing core and CLI"
license = "MIT"
publish = false

[lib]
name = "configtrace_core"
path = "src/lib.rs"

[[bin]]
name = "configtrace"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
notify = "8.2.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"